[project]
name = "big-small-noise"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.10.0",
  "numpy",
  "tokenizers==0.23.1",
  "datasets==4.8.4",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
